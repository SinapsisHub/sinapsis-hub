services:
  sinapsis-unsloth: &default
    image: sinapsis-unsloth:base

    build:
      context: ../
      dockerfile: docker/Dockerfile
      ssh:
        - default
    shm_size: '8gb'
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /lib/python3.10/:/app/.venv/lib/python3.10/site-packages
      LD_LIBRARY_PATH: /app/.venv/lib/python3.10/site-packages/nvidia/cublas/lib
      CUDA_HOME: /usr/local/cuda-12.4
    volumes:
      - "~/.cache/sinapsis/:/root/.cache/sinapsis"
      - "~/.cache/huggingface/hub:/root/.cache/huggingface/hub"
      - "../artifacts:/app/artifacts/"
      - "../outputs:/app/outputs/"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
