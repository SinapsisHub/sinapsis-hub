[project]
name = "sinapsis-api"
version = "1.0.0"
description = "Sinapsis Agent API to run and mange Agent runs locally."
readme = "README.md"
authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
    { name = "Nimesh Patel", email = "nimesh@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]

requires-python = ">=3.13"
dependencies = [
    "sinapsis",
    "fastapi>=0.141.1",
    "gunicorn>=26.2.0",
    "uvicorn>=0.53.0",
    "pyzmq>=27.2.0",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_api"]


[tool.ty.rules]
unresolved-import = "ignore"


[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.8.3",
    "ty>=0.0.32",

]


[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
lint.select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "D",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "PLR6301",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
    "UP",
    "W",
]
lint.preview = true
lint.pydocstyle.convention = "google"
lint.ignore = [
    "ANN401",
    "D100",
    "D104",
    "D107",
    "RUF200",
]
lint.extend-select = [
    "D102",
    "D103",
]
line-length = 120
show-fixes = true
target-version = "py313"
fix = true
exclude = ["src/sinapsis_api/testing", "tests"]


[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs"
Tutorials = "https://docs.sinapsis.tech/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub.git"
