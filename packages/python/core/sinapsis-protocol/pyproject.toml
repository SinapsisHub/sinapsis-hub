[project]
name = "sinapsis_protocol"
description = "Versioned, extensible wire serialization protocol for Sinapsis data containers."
requires-python = ">=3.13"
version = "1.0.0"
authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
    { name = "Nimesh Patel", email = "nimesh@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
dependencies = ["msgpack>=1.0,<2", "sinapsis>=1,<2"]


[project.optional-dependencies]
numpy = ["numpy>=1.24"]
torch = ["torch>=2.0", "numpy>=1.24"]
pandas = ["pandas>=2.0", "pyarrow>=14"]
polars = ["polars>=0.20", "pyarrow>=14"]
cv2 = ["opencv-python>=4.8"]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6"]
all = ["numpy>=1.24", "torch>=2.0", "pandas>=2.0", "polars>=0.20", "pyarrow>=14", "opencv-python>=4.8"]


[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs/latest"
Tutorials = "https://docs.sinapsis.tech/docs/latest/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub"
Issues = "https://github.com/SinapsisHub/sinapsis-hub/issues"
Discord = "https://discord.gg/uuBqQqu2vS"


[[tool.uv.index]]
name = "sinapsis-protected"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-private"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.ruff]
line-length = 120
show-fixes = true
target-version = "py313"


[tool.ruff.lint]
select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
ignore = [
    "ANN401",
    "E501",   # trailing-comma
]


[tool.ruff.format]
skip-magic-trailing-comma = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]


[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_protocol"]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"
