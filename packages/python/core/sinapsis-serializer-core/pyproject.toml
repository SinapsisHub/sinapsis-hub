[project]
name = "sinapsis-serializer-core"
description = "Core serialization primitives, staging file management, and protocol schemas for Sinapsis pipelines."
requires-python = ">=3.13"
version = "1.0.0"
authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
    { name = "Nimesh Patel", email = "nimesh@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
dependencies = [
    "sinapsis>=1,<2",
]


[project.optional-dependencies]
all = [
    "sinapsis-serializer-core[data]",
    "sinapsis-serializer-core[torch]",
    "sinapsis-serializer-core[audio]",
    "sinapsis-serializer-core[timeseries]",
    "sinapsis-serializer-core[vision]",
]
timeseries = [
    "darts>=0.41.0",
    "pandas>=2.3.3",
]

audio = [
    "soundfile>=0.13.1",
]

vision = [
    "opencv-python-headless>=4.13.0.92",
]

torch = [
    "torch>=2.8.0",
]

data = [
    "pandas>=2.3.3",
    "sinapsis-generic-data-tools>=0.1.11",
    "pydub>=0.25.1",
]


[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs/latest"
Tutorials = "https://docs.sinapsis.tech/docs/latest/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub"
Issues = "https://github.com/SinapsisHub/sinapsis-hub/issues"
Discord = "https://discord.gg/uuBqQqu2vS"


[[tool.uv.index]]
name = "sinapsis-protected"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-private"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.ruff]
line-length = 120
show-fixes = true


[tool.ruff.lint]
select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
ignore = [
    "ANN401",
    "E501",   # trailing-comma
]


[tool.ruff.format]
skip-magic-trailing-comma = true


[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]


[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_serializer_core"]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"
