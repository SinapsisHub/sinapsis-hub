[project]
name = "sinapsis"
version = "1.0.0"
description = "The platform where heterogeneous AI converges"
readme = "README.md"

authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
    { name = "Nimesh Patel", email = "nimesh@sinapsis.tech" },
]
maintainers = [
    { name = "Sinapsis", email = "dev@sinapsis.tech" },
]

dependencies = [
    "sinapsis-core",
]

requires-python = ">=3.13"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
license = "MIT OR Apache-2.0"

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "ruff>=0.9.10",
]

[project.optional-dependencies]
all = []

[[tool.uv.index]]
name = "sinapsis-public"
url = "https://pypi.sinapsis.tech/"
explicit = true

[tool.uv.sources]
sinapsis = { index = "sinapsis-public" }


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
lint.select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "D",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "PLR6301",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
    "UP",
    "W",
]
lint.preview = true
lint.pydocstyle.convention = "google"
lint.ignore = [
    "ANN401",
    "D100",
    "D104",
    "D107",
    "RUF200",
]
lint.extend-select = [
    "D102",
    "D103",
]
line-length = 120
show-fixes = true
target-version = "py313"
fix = true
exclude = ["tests"]


[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs"
Tutorials = "https://docs.sinapsis.tech/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub.git"
