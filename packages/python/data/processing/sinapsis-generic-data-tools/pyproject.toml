[project]
name = "sinapsis-generic-data-tools"
version = "1.0.0"
description = "Collection of generic data tools"
authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]


readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]

requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.3",
    "sinapsis>=1,<2",
]



[project.optional-dependencies]
pillow = [
    "pillow>=11.2.1",
]
pydub = [
    "pydub>=0.25.1",
    "audioop-lts>=0.1.0; python_version >= '3.13'",
]
all = [
    "sinapsis-generic-data-tools[cv2,numpy,pillow,pydub,torch]",
]
cv2 = [
    "opencv-python-headless>=4.11.0.86",
]
torch = [
    "torch>=2.5.1",
]
numpy = [
    "numpy>=1.26.4",
]

[[tool.uv.index]]
name = "sinapsis-private"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-internal"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.ruff]
lint.select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
lint.ignore = ['ANN401']
line-length = 120
show-fixes = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_generic_data_tools"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"

[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs"
Tutorials = "https://docs.sinapsis.tech/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub.git"
