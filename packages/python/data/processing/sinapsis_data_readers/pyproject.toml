[project]
name = "sinapsis-data-readers"
version = "1.0.0"
description = "Templates to read data in different formats"
requires-python = ">=3.13"

authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]

license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"

dependencies = [
    "sinapsis>=1,<2",
]

[project.optional-dependencies]
nvidia-dali = ["nvidia-dali-cuda120>=1.43.0"]
torch-codec = [
    "torch>=2.4.1",
    "torchcodec>=0.0.3",
]
sklearn-datasets = ["pandas>=2.2.3", "scikit-learn>=1.5.2"]
sktime-datareaders = ["sktime>=0.34.0"]
coco-dataset = ["pycocotools>=2.0.8"]
soundfile = ["soundfile>=0.12.1"]
pydub = ["pydub>=0.25.1", "soundfile>=0.12.1"]
all = [
    "sinapsis-data-readers[coco-dataset,nvidia-dali,pydub,sklearn-datasets,sktime-datareaders,soundfile,torch-codec,opencv,ffmpeg,kornia]",
]
opencv = [
    "opencv-python-headless>=4.11.0.86",
]
ffmpeg = [
    "ffmpeg-python>=0.2.0",
]
kornia = [
    "kornia>=0.8.1",
    "kornia-rs>=0.1.9",
    "pillow>=11.2.1",
]



[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true


[[tool.uv.index]]
name = "sinapsis-private"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-internal"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.ruff]
lint.select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
lint.ignore = ['ANN401']
line-length = 120
show-fixes = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_cloud"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"

[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs"
Tutorials = "https://docs.sinapsis.tech/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub.git"
