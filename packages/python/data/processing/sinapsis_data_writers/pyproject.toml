[project]
name = "sinapsis-data-writers"
version = "1.0.0"
description = "Templates to write DataContainer content to file."

requires-python = ">=3.13"

authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]

license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"

dependencies = [
    "sinapsis>=1,<2",
    "sinapsis-generic-data-tools",
]

[project.optional-dependencies]
pydub = ["pydub>=0.25.1"]
soundfile = ["soundfile>=0.12.1"]
pdf-image-writer = ["pdf2image>=1.17.0"]
all = ["sinapsis-data-writers[pdf-image-writer,pydub,soundfile,opencv,ffmpeg]"]
opencv = [
    "opencv-python-headless>=4.11.0.86",
]
ffmpeg = [
    "ffmpeg-python>=0.2.0",
]


[[tool.uv.index]]
name = "sinapsis-private"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-internal"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.ruff]
lint.select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
lint.ignore = ['ANN401']
line-length = 120
show-fixes = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_cloud"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"

[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs"
Tutorials = "https://docs.sinapsis.tech/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub.git"
