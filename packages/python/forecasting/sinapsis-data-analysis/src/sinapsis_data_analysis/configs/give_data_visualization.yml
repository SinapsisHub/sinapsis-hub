agent:
  name: credit_risk_visualization

templates:
- template_name: InputTemplate
  class_name: InputTemplate
  attributes: {}

- template_name: fetch_openmlWrapper
  class_name: fetch_openmlWrapper
  template_input: InputTemplate
  attributes:
    split_dataset: false
    train_size: 0.8
    fetch_openml:
      data_id: 45577
      data_home: null
      target_column: "SeriousDlqin2yrs"
      cache: true
      return_X_y: false
      as_frame: true
      n_retries: 3
      delay: 1.0
      parser: "pandas"
      read_csv_kwargs:
        dtype:
          SeriousDlqin2yrs: "category"
          RevolvingUtilizationOfUnsecuredLines: "float64"
          age: "Int64"
          NumberOfTime30-59DaysPastDueNotWorse: "Int64"
          DebtRatio: "float64"
          MonthlyIncome: "float64"
          NumberOfOpenCreditLinesAndLoans: "Int64"
          NumberOfTimes90DaysLate: "Int64"
          NumberRealEstateLoansOrLines: "Int64"
          NumberOfTime60-89DaysPastDueNotWorse: "Int64"
          NumberOfDependents: "Int64"

- template_name: TabularDataVisualization
  class_name: TabularDataVisualization
  template_input: fetch_openmlWrapper
  attributes:
    generic_field_key: "fetch_openmlWrapper"
    target_column: "target"  # OpenML often renames the target to "target"
    fig_title: "Credit Risk Analysis - Give Me Some Credit"
    y_label: "Frecuencia"
    x_label: "Valor"
    fig_width: 12
    fig_height: 8
    save_image_dir: "artifacts/give-me"
    fig_name: "give_me_some_credit"
    # Enable all visualization types
    histogram: true
    box_plot: true
    correlation: true
    categorical_dist: true
    pie_chart: true  # Añadido para crear el gráfico de pie (circular)
