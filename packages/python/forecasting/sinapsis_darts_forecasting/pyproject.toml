[project]
name = "sinapsis-darts-forecasting"
description = "Module for handling time series data and forecasting using Darts."
requires-python = ">=3.13"
version = "1.0.0"
authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
dependencies = [
    "sinapsis>=1,<2",
    "u8darts[all]>=0.40.0",
]


[project.optional-dependencies]

pandas = [
    "pandas>=2.2.3",
]
all = [
    "sinapsis-darts-forecasting[pandas,time-series-visualization]",
]
time-series-visualization = [
    "matplotlib>=3.10.8",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "pillow>=11.3.0",
    "plotly>=6.6.0",
]


[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs"
Tutorials = "https://docs.sinapsis.tech/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub.git"


[[tool.uv.index]]
name = "sinapsis-protected"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-private"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.uv.sources]
sinapsis-darts-forecasting = { workspace = true }


[tool.ruff]
line-length = 120
show-fixes = true


[tool.ruff.lint]
select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
ignore = [
    "ANN401",
    "E501",   # trailing-comma
]


[tool.ruff.format]
skip-magic-trailing-comma = true


[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]


[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_darts_forecasting"]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"
