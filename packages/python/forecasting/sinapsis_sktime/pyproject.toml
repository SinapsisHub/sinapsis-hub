[project]
name = "sinapsis-sktime"
description = "Module for handling time series data and forecasting using sktime."
requires-python = ">=3.13"
version = "1.0.0"
authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
dependencies = [
    "sinapsis>=1,<2",
    "sinapsis-data-analysis>=0.1.0",
    "sktime>=0.36.0",
]


[project.optional-dependencies]
pandas = [
    "pandas>=2.2.3",
]

estimators = [
    "arch>=8.0.0",
    "joblib>=1.5.3",
    "numba>=0.63.1",
    "pmdarima>=2.1.1",
    "prophet>=1.3.0",
    "scipy>=1.15.3",
    "statsforecast>=2.0.1",
    "statsmodels>=0.14.6",
    "tsfresh>=0.21.1",
    "tslearn>=0.7.0",
]
torch = [
    "torch>=2.10.0",
]
tensorflow = [
    "tensorflow>=2.18.1",
]

all = ["sinapsis-sktime[pandas]", "sinapsis-sktime[estimators]", "sinapsis-sktime[torch]", "sinapsis-sktime[tensorflow]"]
data-tools = [
    "sinapsis-data-readers[sklearn-datasets,sktime-datareaders]>=0.1.26",
    "sinapsis-data-writers>=0.1.16",
]


[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs"
Tutorials = "https://docs.sinapsis.tech/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub.git"


[[tool.uv.index]]
name = "sinapsis-protected"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-private"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.ruff]
line-length = 120
show-fixes = true


[tool.ruff.lint]
select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
ignore = [
    "ANN401",
    "E501",   # trailing-comma
]


[tool.ruff.format]
skip-magic-trailing-comma = true


[tool.setuptools]
license-files = []


[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]


[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_sktime"]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"
