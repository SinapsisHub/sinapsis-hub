[project]
name = "sinapsis-timesfm"
description = "Module for time series forecasting using Google's TimesFM foundation model."
requires-python = ">=3.13"
version = "1.0.0"
authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
dependencies = [
    "darts>=0.40.0",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "sinapsis>=1,<2",
    "timesfm",
]


[project.optional-dependencies]
torch = [
    "timesfm[torch]>=2.0.0",
]
flax = [
    "timesfm[flax]>=2.0.0",
]
xreg = [
    "timesfm[xreg]>=2.0.0",
]
all = [
    "sinapsis-timesfm[flax,torch,xreg,sinapsis-darts-forecasting, sinapsis-data-readers]",
]
sinapsis-darts-forecasting = [
    "sinapsis-darts-forecasting",
]
sinapsis-data-readers = [
    "sinapsis-data-readers>=0.1.28",
]


[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs"
Tutorials = "https://docs.sinapsis.tech/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub.git"


[[tool.uv.index]]
name = "sinapsis-protected"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-private"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.uv.sources]
timesfm = { git = "https://github.com/google-research/timesfm" }



[tool.ruff]
line-length = 120
show-fixes = true


[tool.ruff.lint]
select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
ignore = [
    "ANN401",
    "E501",   # trailing-comma
]


[tool.ruff.format]
skip-magic-trailing-comma = true


[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]


[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_timesfm"]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"
