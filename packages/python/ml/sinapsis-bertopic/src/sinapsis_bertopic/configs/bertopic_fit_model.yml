agent:
  name: Bertopic-fit-model
  description: Multi-topic Wikipedia data aggregator and BERTopic topic modeling agent.
  long_description: >
    This agent sequentially aggregates Wikipedia content across diverse themes—including GenAI, history, and tech—to perform automated thematic discovery.
    By funneling these datasets into a BERTopic model, it identifies latent semantic patterns and clusters, ultimately serializing the trained model for structured analysis.

templates:
  - template_name: InputTemplate
    class_name: InputTemplate
    attributes: {}

  - template_name: WikipediaLoaderWrapper1
    class_name: WikipediaLoaderWrapper
    template_input: InputTemplate
    attributes:
      add_document_as_text_packet: true
      wikipedialoader_init:
        query: macroeconomics and central banking
        lang: en
        load_max_docs: 5
        load_all_available_meta: false
        doc_content_chars_max: 4000

  - template_name: WikipediaLoaderWrapper2
    class_name: WikipediaLoaderWrapper
    template_input: WikipediaLoaderWrapper1
    attributes:
      add_document_as_text_packet: true
      wikipedialoader_init:
        query: foreign exchange mechanics and currency markets
        lang: en
        load_max_docs: 30
        load_all_available_meta: false
        doc_content_chars_max: 4000

  - template_name: WikipediaLoaderWrapper3
    class_name: WikipediaLoaderWrapper
    template_input: WikipediaLoaderWrapper2
    attributes:
      add_document_as_text_packet: true
      wikipedialoader_init:
        query: trading strategies & market dynamics
        lang: en
        load_max_docs: 30
        load_all_available_meta: false
        doc_content_chars_max: 4000

  - template_name: WikipediaLoaderWrapper4
    class_name: WikipediaLoaderWrapper
    template_input: WikipediaLoaderWrapper3
    attributes:
      add_document_as_text_packet: true
      wikipedialoader_init:
        query: financial instruments & risk
        lang: en
        load_max_docs: 30
        load_all_available_meta: false
        doc_content_chars_max: 4000

  - template_name: WikipediaLoaderWrapper5
    class_name: WikipediaLoaderWrapper
    template_input: WikipediaLoaderWrapper4
    attributes:
      add_document_as_text_packet: true
      wikipedialoader_init:
        query: fintechs & emerging trends
        lang: en
        load_max_docs: 30
        load_all_available_meta: false
        doc_content_chars_max: 4000

  - template_name: WikipediaLoaderWrapper6
    class_name: WikipediaLoaderWrapper
    template_input: WikipediaLoaderWrapper5
    attributes:
      add_document_as_text_packet: true
      wikipedialoader_init:
        query: barriers and regulations in finance
        lang: en
        load_max_docs: 30
        load_all_available_meta: false
        doc_content_chars_max: 4000

  - template_name: WikipediaLoaderWrapper7
    class_name: WikipediaLoaderWrapper
    template_input: WikipediaLoaderWrapper6
    attributes:
      add_document_as_text_packet: true
      wikipedialoader_init:
        query: financial crises and historical events
        lang: en
        load_max_docs: 30
        load_all_available_meta: false
        doc_content_chars_max: 4000

  - template_name: WikipediaLoaderWrapper8
    class_name: WikipediaLoaderWrapper
    template_input: WikipediaLoaderWrapper7
    attributes:
      add_document_as_text_packet: true
      wikipedialoader_init:
        query: loans, credit, and consumer finance
        lang: en
        load_max_docs: 30
        load_all_available_meta: false
        doc_content_chars_max: 4000

  - template_name: BERTopicFitModel
    template_input: WikipediaLoaderWrapper8
    class_name: BERTopicFitModel
    attributes:
      bertopic_model_params:
        calculates_probabilities: true
        min_topic_size: 5
      export_visualization_to_image: true
      root_dir: "artifacts"
      prediction_viz_path: "bertopic_prediction_visualization.html"
      save_training_data: true
      save_training_data_path: "training_data-v2.pkl"
      save_vizualization_path: "finance_visualization-v2.html"
      save_model_path: "bert_model_finance-v2"
      bertopic_save_params:
        serialization: pytorch
