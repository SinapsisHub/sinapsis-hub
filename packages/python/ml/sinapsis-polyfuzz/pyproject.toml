[project]
name = "sinapsis-polyfuzz"
description = "Templates for PolyFuzz string matching and similarity models."
requires-python = ">=3.13"
version = "1.0.0"
authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
    { name = "Nimesh Patel", email = "nimesh@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
dependencies = [
    "polyfuzz>=0.4.3",
    "matplotlib<3.9.0",
    "sinapsis>=1.0.0",
]


[project.optional-dependencies]
sbert = [
    "polyfuzz[sbert]>=0.4.3",
]
flair = [
    "polyfuzz[flair]>=0.4.3",
]
gensim = [
    "polyfuzz[gensim]>=0.4.3",
]
use = [
    "polyfuzz[use]>=0.4.3",
    "setuptools<70.0.0",
]
fast = [
    "polyfuzz[fast]>=0.4.3",
]
spacy = [
    "spacy>=3.8.11",
]
sinapsis-data-readers = [
    "sinapsis-data-readers>=1.0.0",
]
all = [
    "sinapsis-polyfuzz[sbert,flair,gensim,use,fast,spacy]",
    "sinapsis-polyfuzz[sinapsis-data-readers]",
]


[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs/latest"
Tutorials = "https://docs.sinapsis.tech/docs/latest/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub"
Issues = "https://github.com/SinapsisHub/sinapsis-hub/issues"
Discord = "https://discord.gg/uuBqQqu2vS"


[[tool.uv.index]]
name = "sinapsis-protected"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-private"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.ruff]
line-length = 120
show-fixes = true
target-version = "py310"
fix = true


[tool.ruff.lint]
select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
ignore = [
    "ANN401",
    "E501",   # trailing-comma
]
preview = true


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
skip-magic-trailing-comma = true


[dependency-groups]
dev = [
    "ruff>=0.8.3",
    "pre-commit>=4.0.1",
]


[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_polyfuzz"]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"
