agent:
  name: my_test_agent
  description: "Agent utilizing Edit Distance for character-level similarity."

templates:
  - template_name: InputTemplate
    class_name: InputTemplate
    attributes: {}

  - template_name: CSVDatasetReader
    class_name: CSVDatasetReader
    template_input: InputTemplate
    attributes:
      root_dir: "artifacts"
      path_to_csv: "example.csv"
      store_as_time_series: false

  - template_name: EditDistanceWrapper
    class_name: EditDistanceWrapper
    template_input: CSVDatasetReader
    attributes:
      target_column: "company_name"
      to_list:
        - "Apple Inc"
        - "Microsoft Corporation"
        - "Google LLC"
        - "Amazon.com"
        - "Netflix Inc"
        - "Tesla Motors"
        - "Meta Platforms"
        - "NVIDIA Corp"
        - "Intel Corp"
      overwrite: true
      editdistance_init:
        n_jobs: 1
        normalize: true
