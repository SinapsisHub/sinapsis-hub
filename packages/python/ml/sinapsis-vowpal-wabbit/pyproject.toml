[project]
name = "sinapsis-vowpal-wabbit"
description = "Package for Vowpal Wabbit algorithms, featuring high-performance implementations of Contextual Bandits (ADF) and reinforcement learning patterns."
requires-python = ">=3.13"
version = "1.0.0"
authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
dependencies = [
    "pandas>=2.3.3",
    "setuptools==81.0.0",
    "sinapsis>=1,<2",
    "vowpalwabbit>=9.10.0",
]


[project.optional-dependencies]
sinapsis-data-readers = [
    "sinapsis-data-readers>=0.1.26",
]
all = [
    "sinapsis-vowpal-wabbit[scikit-learn,sentence-transformers,sinapsis-data-readers]",
]
sentence-transformers = [
    "sentence-transformers>=5.2.3",
]
scikit-learn = [
    "scikit-learn>=1.7.2",
]


[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs"
Tutorials = "https://docs.sinapsis.tech/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub.git"


[[tool.uv.index]]
name = "sinapsis-protected"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-private"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.uv.sources]
sinapsis-vowpal-wabbit = { workspace = true }


[tool.ruff]
line-length = 120
show-fixes = true
target-version = "py310"
fix = true


[tool.ruff.lint]
select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
ignore = [
    "ANN401",
    "E501",   # trailing-comma
]
preview = true
extend-select = [
    "D102",
    "D103",
]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
skip-magic-trailing-comma = true


[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ty>=0.0.33",
]


[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_vowpal_wabbit"]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"
