agent:
  name: cb_explore_adf
  description:
  long_description:

templates:
  - template_name: InputTemplate
    class_name: InputTemplate
    attributes: {}

  - template_name: TextInput
    class_name: TextInput
    template_input: InputTemplate
    attributes:
      source: local
      text: I am extremely frustrated with the delay and I want my money back!

  - template_name: TextInput1
    class_name: TextInput
    template_input: TextInput
    attributes:
      source: local
      text: I am not satisfied with the service, I want to cancel it!.

  - template_name: TextInput2
    class_name: TextInput
    template_input: TextInput1
    attributes:
      source: local
      text: I haven't receive any status updates in weeks, I need to have a call with the manager.

  - template_name: CBExploreADFPredict
    class_name: CBExploreADFPredict
    template_input: TextInput2
    attributes:
      random_seed: 42
      actions:
        [
          "cancel_order",
          "change_order",
          "change_shipping_address",
          "check_cancellation_fee",
          "check_invoice",
          "check_payment_methods",
          "check_refund_policy",
          "complaint",
          "contact_customer_service",
          "contact_human_agent",
          "create_account",
          "delete_account",
          "delivery_options",
          "delivery_period",
          "edit_account",
          "get_invoice",
          "get_refund",
          "newsletter_subscription",
          "payment_issue",
          "place_order",
          "recover_password",
          "registration_problems",
          "review",
          "set_up_shipping_address",
          "switch_account",
          "track_order",
          "track_refund",
        ]
      model_path: artifacts/cb_model-clean-text.vw
      threshold: 0.2
      vw_workspace_params:
        exploration_method: bag
        exploration_value: 5
        adaptive: True
        normalized: True
        quiet: True
