[project]
name = "sinapsis_sdk"
description = "Sinapsis SDK for interaction with the sinapsis cloud, api, and other backend services"
requires-python = ">=3.13"
version = "1.0.0"
authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
    { name = "Nimesh Patel", email = "nimesh@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
dependencies = [
    "sinapsis>=1,<2",
    "sinapsis-contracts>=1.0.0,<2",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "supabase>=2.31.0",
    "msgpack>=1.2.1",
]


[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs"
Tutorials = "https://docs.sinapsis.tech/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub.git"


[[tool.uv.index]]
name = "sinapsis-protected"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-private"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.ruff]
line-length = 120
show-fixes = true
target-version = "py313"
fix = true
exclude = ["src/sinapsis_contrib/testing", "tests"]


[tool.ruff.lint]
select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
ignore = [
    "ANN401",
    "E501",   # trailing-comma
]
preview = true
extend-select = [
    "D102",
    "D103",
]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
skip-magic-trailing-comma = true


[tool.pytest.ini_options]
asyncio_mode = "auto"


[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.8.3",
    "ty>=0.0.32",

]


[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_sdk"]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"
