agent:
  name: SinapsisSortformerDiarizer_agent
  description: "Agent with SinapsisSortformerDiarizer."
  attributes:
    queue_name: SinapsisSortformerDiarizer
    templates_to_profile: "SinapsisSortformerDiarizer"
    description: "SinapsisSortformerDiarizer worker"

templates:
- template_name: InputTemplate
  class_name: InputTemplate
  attributes: {}

- template_name: SinapsisSortformerDiarizer
