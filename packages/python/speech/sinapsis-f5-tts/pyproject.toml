[project]
name = "sinapsis-f5-tts"
description = "Text to speech using F5-TTS library"
requires-python = ">=3.13"
version = "1.0.0"
authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
dependencies = [
    "f5-tts>=1.0.3",
    "sinapsis>=1,<2",
    "soundfile>=0.12.1",
    "torchaudio>=2.8.0",
]


[project.optional-dependencies]
sinapsis-data-tools = [
    "sinapsis-data-readers>=0.1.0",
    "sinapsis-data-writers>=0.1.0",
]

all = [
    "sinapsis-f5-tts[sinapsis-data-tools]",
]


[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs"
Tutorials = "https://docs.sinapsis.tech/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub.git"


[[tool.uv.index]]
name = "sinapsis-protected"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-private"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.uv.sources]
sinapsis-f5-tts = { workspace = true }


[tool.ruff]
line-length = 120
show-fixes = true


[tool.ruff.lint]
select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
ignore = [
    "ANN401",
    "E501",   # trailing-comma
]


[tool.ruff.format]
skip-magic-trailing-comma = true


[dependency-groups]
dev = [
    "ruff>=0.8.3",
    "pre-commit>=4.0.1",
]


[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_f5_tts"]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"
