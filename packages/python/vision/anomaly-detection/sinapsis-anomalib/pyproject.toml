[project]
name = "sinapsis-anomalib"
description = "Templates for anomaly detection with computer vision using anomalib library."
requires-python = ">=3.13"
version = "1.0.0"
authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
dependencies = [
    "torch>=2.5.1",
    "einops>=0.8.0",
    "freia>=0.2",
    "imgaug>=0.4.0",
    "kornia>=0.7.4",
    "matplotlib==3.9.0",
    "nncf>=2.14.0",
    "numpy==1.26.4",
    "onnx>=1.17.0",
    "opencv-python>=4.10.0.84",
    "openvino>=2024.5.0",
    "pandas>=2.2.3",
    "psutil>=6.1.0",
    "scikit-learn>=1.5.2",
    "sinapsis>=1,<2",
    "dotenv>=0.9.9",
    "anomalib>=2.0.0",
    "torchvision>=0.20.1",
    "timm>=1.0.15",
    "open-clip-torch>=2.31.0",
    "lightning>=2.4.1",
]


[project.optional-dependencies]

vlm = [
    "python-dotenv>=1.0.1",
    "transformers>=4.45.0",
    "openai>=1.50.0",
    "ollama>=0.4.7",
]

loggers = [
    "comet>=3.1.0",
    "mlflow>=2.19.0",
    "tensorboard>=2.18.0",
    "wandb>=0.19.1",
]

all = [
    "sinapsis-anomalib[vlm, loggers]",
]


[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs"
Tutorials = "https://docs.sinapsis.tech/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub.git"


[[tool.uv.index]]
name = "sinapsis-protected"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-private"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.ruff]
line-length = 120
show-fixes = true


[tool.ruff.lint]
select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
ignore = [
    "ANN401",
    "E501",   # trailing-comma
]


[tool.ruff.format]
skip-magic-trailing-comma = true


[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]


[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_anomalib"]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"
