agent:
  name: anomalib_train_export
  description: "Agent to train and export to Torch format a segmentation Cflow model."

templates:
- template_name: InputTemplate
  class_name: InputTemplate
  attributes: {}

- template_name: CflowTrain
  class_name: PatchcoreTrain
  template_input: InputTemplate
  attributes:
    folder_attributes:
      name: "conveyor_belt_dataset"
      root: artifacts/unsupervised-anomaly-dataset/ # Where crops-small-mixed is located
      normal_dir: "crops-small-mixed"
      extensions: [".jpg", ".png", ".JPG", ".PNG"]
      train_batch_size: 32
      eval_batch_size: 32
      num_workers: 2
      test_split_mode: "synthetic"
      test_split_ratio: 0.2
      val_split_mode: "same_as_test"
      val_split_ratio: 0.2
      seed: 42
    train_root: "train"
    trainer_args:
      max_epochs: 1
      devices: 1
      accelerator: "gpu"


    patchcore_init:
      coreset_sampling_ratio: 0.1

- template_name: CflowExport
  class_name: PatchcoreExport
  template_input: CflowTrain
  attributes:
    generic_key_chkpt: CflowTrain
    input_size: [512, 512]
    export_type: "torch"
    export_root: "exported_models/patchcore/synthetic/"
    patchcore_init:
      coreset_sampling_ratio: 0.1
