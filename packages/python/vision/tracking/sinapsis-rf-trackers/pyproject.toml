[project]
name = "sinapsis-rf-trackers"
description = "Multi-object tracking templates using SORT and DeepSORT algorithms"
requires-python = ">=3.13"
version = "1.0.0"
authors = [
    { name = "Ariel Ruiz-Garcia", email = "ariel@sinapsis.tech" },
]
maintainers = [
    { name = "sinapsis", email = "dev@sinapsis.tech" },
]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
dependencies = [
    "sinapsis>=1,<2",
    "sinapsis-data-visualization[visualization-matplotlib]>=0.1.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "trackers[reid]==2.0.2rc0",
]


[project.optional-dependencies]
all = [
    "sinapsis-rf-trackers[sinapsis-ultralytics,sinapsis-dfine,sinapsis-data-readers,sinapsis-data-writers]",
]
sinapsis-ultralytics = [
    "sinapsis-ultralytics>=0.1.1",
]
sinapsis-dfine = [
    "sinapsis-dfine[training]>=0.1.1",
]
sinapsis-data-readers = [
    "sinapsis-data-readers[opencv]>=0.1.2",
]
sinapsis-data-writers = [
    "sinapsis-data-writers>=0.1.1",
]


[project.urls]
Homepage = "https://sinapsis.tech"
Documentation = "https://docs.sinapsis.tech/docs"
Tutorials = "https://docs.sinapsis.tech/tutorials"
Repository = "https://github.com/SinapsisHub/sinapsis-hub.git"


[[tool.uv.index]]
name = "sinapsis-protected"
url = "https://private.pypi.sinapsis.tech/"
explicit = true


[[tool.uv.index]]
name = "sinapsis-private"
url = "https://pypi.sinapsis.tech/"
explicit = true


[tool.uv.sources]
sinapsis-supervision = { workspace = true }


[tool.ruff]
line-length = 120
show-fixes = true


[tool.ruff.lint]
select = [
    "ARG",
    "ANN",
    "BLE",
    "C4",
    "E",
    "F",
    "FIX",
    "FLY",
    "I",
    "PERF",
    "PIE",
    "RUF",
    "RSE",
    "SIM",
    "SLOT",
    "T10",
    "T20",
    "TD",
    "TID",
]
ignore = [
    "ANN401",
    "E501",   # trailing-comma
]


[tool.ruff.format]
skip-magic-trailing-comma = true


[dependency-groups]
dev = [
    "ruff>=0.8.3",
    "pre-commit>=4.0.1",
]


[tool.hatch.build.targets.wheel]
packages = ["src/sinapsis_rf_trackers"]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "vcs"
